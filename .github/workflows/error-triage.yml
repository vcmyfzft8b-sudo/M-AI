name: Error triage

# Scans Vercel production logs and Sentry issues every three hours, fixes every
# actionable error it finds, verifies each fix on its own Vercel preview, and opens
# one PR per fix. Both scans can wake the run on their own: a handled route error
# or client-side exception exists only in Sentry, never as a Vercel 5xx. It never
# merges and never pushes to main.
# See docs/error-triage-automation.md.
#
# The scan runs before `npm ci` and before Claude starts, so a run that finds nothing
# costs about a minute instead of several. Most runs find nothing.
#
# GitHub only runs scheduled workflows from the default branch, so this file has to
# be on `main` before the cron fires.

on:
  schedule:
    # Every three hours, off the hour so it does not land with everyone else's cron.
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "Override the scan start (ISO 8601 or relative like 6h). Ignores the stored cursor and does not advance it."
        required: false
        type: string
      dry_run:
        description: "Scan and report only: no branch, no fix, no PR."
        required: false
        type: boolean
        default: false
      max_fixes:
        description: "Maximum fixes to attempt in this run."
        required: false
        type: string
        default: "5"

# Two triage runs at once would fight over the state branch and could open duplicate PRs.
concurrency:
  group: error-triage
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  triage:
    name: Scan, fix, verify, open PRs
    runs-on: ubuntu-latest
    # Room for several fix-verify cycles; each one waits on a real preview build.
    timeout-minutes: 120

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT rather than GITHUB_TOKEN, so pushes from this job trigger the CI
          # workflow on the resulting PRs.
          token: ${{ secrets.TRIAGE_GITHUB_TOKEN }}

      - name: Configure git identity
        # Early and ungated on purpose. "Save triage state" runs on every outcome,
        # and a step placed after one that can fail is skipped, which previously
        # left the state commit with no identity.
        run: |
          git config --global user.name "memo-error-triage[bot]"
          git config --global user.email "error-triage@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the pinned Vercel CLI
        # A day-long catch-up scan is ~48 CLI invocations; installing once beats
        # letting npx resolve the package every time.
        run: npm install -g vercel@50.35.0

      - name: Restore triage state
        # State lives in the repository's Actions variables (TRIAGE_STATE,
        # TRIAGE_BACKLOG), not on a branch. A state branch got a push every run,
        # which made GitHub nag "had recent pushes" forever and offer a PR that
        # must never be opened.
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .triage-state
          # Listing first separates "variable does not exist yet" (fine, seed
          # defaults) from "cannot reach the API" (fail loudly: silently seeding
          # an empty state would reset the cursor and orphan the backlog).
          names="$(gh variable list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')"
          for pair in "TRIAGE_STATE:state.json:{}" 'TRIAGE_BACKLOG:backlog.json:{"entries":[]}'; do
            var="${pair%%:*}"; rest="${pair#*:}"; file="${rest%%:*}"; seed="${rest#*:}"
            if grep -qx "$var" <<< "$names"; then
              gh variable get "$var" --repo "$GITHUB_REPOSITORY" > ".triage-state/$file"
            else
              printf '%s\n' "$seed" > ".triage-state/$file"
              echo "No $var yet; seeded a default."
            fi
          done
          echo "state: $(wc -c < .triage-state/state.json) bytes, backlog: $(wc -c < .triage-state/backlog.json) bytes"

      - name: Plan the window
        id: window
        run: |
          set -euo pipefail
          node scripts/triage-state.mjs plan \
            --state .triage-state/state.json \
            --since-override "${{ inputs.since }}" > /tmp/window.json
          cat /tmp/window.json
          {
            echo "since=$(jq -r .since /tmp/window.json)"
            echo "until=$(jq -r .until /tmp/window.json)"
            echo "may_advance=$(jq -r .mayAdvanceCursor /tmp/window.json)"
          } >> "$GITHUB_OUTPUT"

      # Runs before `npm ci` on purpose: both scanners use only Node built-ins.
      - name: Scan Vercel and Sentry
        id: scan
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ secrets.SENTRY_BASE_URL }}
        run: |
          set -uo pipefail
          node scripts/vercel-error-scan.mjs \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --out /tmp/vercel-report.json
          rc=$?
          # 0 = complete window, 3 = partially unreadable but still worth triaging.
          # Anything else (2 = misconfigured, 1 = crash) must fail the job loudly:
          # treating it as "no errors found" would advance the cursor over a window
          # nobody actually read.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            echo "::error::Vercel scan exited $rc; refusing to advance the cursor."
            exit "$rc"
          fi

          # Sentry is a detection source of its own, not just enrichment -- a
          # handled route error or a client-side exception never produces a
          # Vercel 5xx. If this scan fails, the Sentry half of the window went
          # unread: keep triaging on Vercel data, but the cursor must not
          # advance over the unread gap (handled below and in the playbook).
          if node scripts/sentry-error-scan.mjs \
            --since "${{ steps.window.outputs.since }}" \
            --until "${{ steps.window.outputs.until }}" \
            --out /tmp/sentry-report.json; then
            echo "sentry_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sentry scan failed; continuing on Vercel data alone and holding the cursor."
            rm -f /tmp/sentry-report.json
            echo "sentry_ok=false" >> "$GITHUB_OUTPUT"
          fi

          node scripts/triage-state.mjs gate \
            --vercel /tmp/vercel-report.json \
            --sentry /tmp/sentry-report.json \
            --backlog .triage-state/backlog.json > /tmp/gate.json
          cat /tmp/gate.json
          echo "actionable=$(jq -r .actionable /tmp/gate.json)" >> "$GITHUB_OUTPUT"

      - name: Nothing to do
        if: steps.scan.outputs.actionable != 'true'
        run: |
          set -euo pipefail
          echo "No new or regressed production errors between ${{ steps.window.outputs.since }} and ${{ steps.window.outputs.until }}."
          # A hand-dispatched window is still a healthy run; it just must not move
          # the cursor, or an ad-hoc investigation would erase scheduled coverage.
          if [ "${{ steps.scan.outputs.sentry_ok }}" != "true" ]; then
            # The Sentry half of the window was never read, so "nothing found"
            # is not a complete answer. Advancing the cursor would skip whatever
            # Sentry-only errors happened in it; record a failed run and let the
            # next one re-read the window.
            echo "Sentry scan failed; holding the cursor so the window is re-read."
            node scripts/triage-state.mjs commit \
              --state .triage-state/state.json \
              --until "${{ steps.window.outputs.until }}" --status failed
          elif [ "${{ steps.window.outputs.may_advance }}" = "true" ]; then
            node scripts/triage-state.mjs commit \
              --state .triage-state/state.json \
              --until "${{ steps.window.outputs.until }}" --status ok
          else
            echo "Hand-dispatched window; recording the run but leaving the cursor where it was."
            node scripts/triage-state.mjs commit \
              --state .triage-state/state.json \
              --until "${{ steps.window.outputs.until }}" --status ok --no-advance
          fi

      - name: Install dependencies
        if: steps.scan.outputs.actionable == 'true'
        run: npm ci

      - name: Fix, verify, and open PRs
        if: steps.scan.outputs.actionable == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_BASE_URL: ${{ secrets.SENTRY_BASE_URL }}
          # Synthetic staging account for authenticated preview checks. Optional:
          # without it the run verifies what it can and flags the rest for a human.
          PREVIEW_TEST_EMAIL: ${{ secrets.PREVIEW_TEST_EMAIL }}
          PREVIEW_TEST_PASSWORD: ${{ secrets.PREVIEW_TEST_PASSWORD }}
          # Everything the scan already worked out, so the agent does not redo it.
          TRIAGE_SINCE: ${{ steps.window.outputs.since }}
          TRIAGE_UNTIL: ${{ steps.window.outputs.until }}
          TRIAGE_MAY_ADVANCE_CURSOR: ${{ steps.window.outputs.may_advance }}
          TRIAGE_VERCEL_REPORT: /tmp/vercel-report.json
          TRIAGE_SENTRY_REPORT: /tmp/sentry-report.json
          TRIAGE_GATE: /tmp/gate.json
          TRIAGE_MAX_FIXES: ${{ inputs.max_fixes || '5' }}
          TRIAGE_DRY_RUN: ${{ inputs.dry_run }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.TRIAGE_GITHUB_TOKEN }}
          prompt: "/error-triage"
          claude_args: |
            --model claude-opus-5
            --max-turns 300
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: Save triage state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.TRIAGE_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s .triage-state/state.json ]; then
            echo "No state files to save (restore never ran); leaving the stored state alone."
            exit 0
          fi
          # Variables cap at 48KB. The playbook prunes the backlog; this is the
          # loud alarm if that ever stops being enough.
          size="$(wc -c < .triage-state/backlog.json)"
          if [ "$size" -gt 45000 ]; then
            echo "::warning::backlog.json is ${size} bytes, near the 48KB variable cap; pruning is falling behind."
          fi
          gh variable set TRIAGE_STATE --repo "$GITHUB_REPOSITORY" < .triage-state/state.json
          gh variable set TRIAGE_BACKLOG --repo "$GITHUB_REPOSITORY" < .triage-state/backlog.json
          echo "Saved triage state to repository variables."
