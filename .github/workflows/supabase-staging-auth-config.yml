name: Supabase staging auth email config

# Vercel Preview deployments sign in against the shared Supabase staging
# branch, which keeps its own Auth configuration. This workflow pushes the
# repository's email templates to that branch so Preview sends the same typed
# sign-in code as production instead of Supabase's default magic-link email.
#
# The Supabase access token is deliberately read from the branch-protected
# `Production` environment rather than a repository-wide secret. A personal
# access token can administer every project on the account, so it must not be
# readable by a workflow run from an arbitrary branch. The cost of that choice
# is that this workflow only runs from `main`; to configure a project before a
# branch is merged, run the script locally with a short-lived token:
#
#   SUPABASE_ACCESS_TOKEN=... npm run supabase:auth-emails -- --project-ref <ref>

on:
  push:
    branches:
      - main
    paths:
      - "supabase/templates/**"
      - "supabase/config.toml"
      - "scripts/sync-supabase-auth-emails.mjs"
      - ".github/workflows/supabase-staging-auth-config.yml"
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref to configure
        required: true
        default: yviipoccwsndxyrhtcjm
      dry_run:
        description: Report the pending changes without writing them
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-staging-auth-config
  cancel-in-progress: false

jobs:
  sync-auth-emails:
    name: Sync auth email templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project_ref || 'yviipoccwsndxyrhtcjm' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the Supabase access token is available
        shell: bash
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      # The script refuses to write to the production project unless it is
      # given --allow-production, which this workflow never passes.
      - name: Sync auth email configuration
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-supabase-auth-emails.mjs --project-ref "$PROJECT_REF" --dry-run
          else
            node scripts/sync-supabase-auth-emails.mjs --project-ref "$PROJECT_REF"
          fi
