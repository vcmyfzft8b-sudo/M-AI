name: Supabase staging auth email config

# Vercel Preview deployments sign in against the shared Supabase staging
# branch, which keeps its own Auth configuration. This workflow pushes the
# repository's email templates to that branch so Preview sends the same typed
# sign-in code as production instead of Supabase's default magic-link email.

on:
  push:
    branches:
      - main
      - claude/preview-login-email-code-lfouiu
    paths:
      - "supabase/templates/**"
      - "supabase/config.toml"
      - "scripts/sync-supabase-auth-emails.mjs"
      - ".github/workflows/supabase-staging-auth-config.yml"
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project ref to configure
        required: true
        default: yviipoccwsndxyrhtcjm
      dry_run:
        description: Report the pending changes without writing them
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-staging-auth-config
  cancel-in-progress: false

jobs:
  sync-auth-emails:
    name: Sync auth email templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project_ref || 'yviipoccwsndxyrhtcjm' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify the Supabase access token is available
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not available to this workflow."
            echo "Add it as a repository secret, or run the sync locally:"
            echo "  SUPABASE_ACCESS_TOKEN=... node scripts/sync-supabase-auth-emails.mjs --project-ref $PROJECT_REF"
            exit 1
          fi

      - name: Sync auth email configuration
        shell: bash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/sync-supabase-auth-emails.mjs --project-ref "$PROJECT_REF" --dry-run
          else
            node scripts/sync-supabase-auth-emails.mjs --project-ref "$PROJECT_REF"
          fi
