<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Memo AI</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #f7f7f9;
        color: #111827;
      }

      main {
        width: min(22rem, calc(100vw - 2rem));
        text-align: center;
      }

      img {
        width: 5rem;
        height: 5rem;
        object-fit: contain;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.35rem;
      }

      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./memo-logo.png" alt="" />
      <h1>Memo AI</h1>
      <p>Povezava do aplikacije trenutno ni na voljo. Preveri internetno povezavo in poskusi znova.</p>
    </main>
  </body>
</html>
