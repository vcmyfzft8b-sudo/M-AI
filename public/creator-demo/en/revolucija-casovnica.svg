<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Timeline of the French Revolution from 1789 to 1799">
  <rect width="1200" height="620" fill="#f7f5f0"/>

  <path d="M90 310H1110" stroke="#3f3a33" stroke-width="6" stroke-linecap="round"/>

  <g fill="#c0392b">
    <circle cx="170" cy="310" r="18"/>
    <circle cx="404" cy="310" r="18"/>
    <circle cx="638" cy="310" r="18"/>
    <circle cx="872" cy="310" r="18"/>
    <circle cx="1060" cy="310" r="18"/>
  </g>

  <g stroke="#9aa5ad" stroke-width="3">
    <path d="M170 292V196M404 328V424M638 292V196M872 328V424M1060 292V196"/>
  </g>

  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="170" y="176" font-size="34" fill="#c0392b" font-weight="bold">1789</text>
    <text x="170" y="132" font-size="26" fill="#3f3a33">fall of the Bastille</text>
    <text x="170" y="100" font-size="26" fill="#3f3a33">Estates-General,</text>

    <text x="404" y="470" font-size="34" fill="#c0392b" font-weight="bold">1791</text>
    <text x="404" y="510" font-size="26" fill="#3f3a33">First constitution,</text>
    <text x="404" y="542" font-size="26" fill="#3f3a33">constitutional monarchy</text>

    <text x="638" y="176" font-size="34" fill="#c0392b" font-weight="bold">1792</text>
    <text x="638" y="132" font-size="26" fill="#3f3a33">proclaimed</text>
    <text x="638" y="100" font-size="26" fill="#3f3a33">Republic</text>

    <text x="872" y="470" font-size="34" fill="#c0392b" font-weight="bold">1793–94</text>
    <text x="872" y="510" font-size="26" fill="#3f3a33">Jacobin dictatorship</text>
    <text x="872" y="542" font-size="26" fill="#3f3a33">and the Terror</text>

    <text x="1060" y="176" font-size="34" fill="#c0392b" font-weight="bold">1799</text>
    <text x="1060" y="132" font-size="26" fill="#3f3a33">coup d’état</text>
    <text x="1060" y="100" font-size="26" fill="#3f3a33">Napoleon’s</text>
  </g>

  <text x="90" y="600" font-family="Georgia, serif" font-size="26" fill="#7a736a">From a society of estates to a republic in ten years.</text>
</svg>
